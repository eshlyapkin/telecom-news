[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telecom-news"
version = "0.1.0"
description = "Daily monitoring and publishing of SMS/messaging industry news (sources -> collect -> normalize -> storage/dedup -> LLM (LM Studio) -> Telegram). MVP interface: CLI."
readme = "README.md"
requires-python = ">=3.10"
# M0 Foundation: no external runtime dependencies by design (ROADMAP M0).
# httpx/feedparser are added in M1, LM Studio/Telegram clients in M3/M4.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
